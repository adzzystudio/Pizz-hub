<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Hub - Owner Admin</title>
<link rel="manifest" href="/manifest-admin.json">
<meta name="theme-color" content="#0f4c45">
<meta name="apple-mobile-web-app-title" content="Admin">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{
  --brand:#0f4c45; --brand-2:#166b60; --accent:#f2a33a;
  --bg:#f3f6f5; --card:#ffffff; --ink:#1b2523; --mute:#6b7a76; --line:#e2e9e6;
  --new:#f2a33a; --prep:#3b82f6; --ready:#1f9d55; --done:#7b8785; --bad:#c0392b;
  --radius:14px; --shadow:0 2px 10px rgba(15,76,69,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
button,input,select{font:inherit}
button{cursor:pointer}

/* ---------- Login ---------- */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--brand),var(--brand-2))}
.login-card{background:var(--card);width:100%;max-width:380px;border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{margin:0 0 4px;font-size:24px;color:var(--brand)}
.login-card p{margin:0 0 20px;color:var(--mute)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--mute);margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.err{color:var(--bad);min-height:22px;font-size:14px;margin-bottom:6px}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--brand);color:#fff;font-weight:700;font-size:15px}
.btn:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);color:#1b2523}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* ---------- Shell ---------- */
.app{display:none;min-height:100%}
.app.show{display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--brand);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 20px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#1b2523;display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:17px}
.brand small{opacity:.75;font-size:13px}
.nav-btn{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#d7ebe7;padding:12px 12px;border-radius:12px;text-align:left;font-size:16px;font-weight:600;width:100%}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn.active{background:#fff;color:var(--brand)}
.nav-btn .ic{font-size:18px;width:24px;text-align:center}
.nav-btn .count{margin-left:auto;background:var(--accent);color:#1b2523;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px}
.side-foot{margin-top:auto}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.topbar h2{margin:0;font-size:21px}
.topbar .sub{color:var(--mute);font-size:14px}
.content{padding:20px 22px 110px;max-width:1100px;width:100%}
.page{display:none}
.page.show{display:block}

/* ---------- Cards & stats ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;border-left:5px solid var(--brand)}
.stat.a{border-left-color:var(--accent)}
.stat.b{border-left-color:var(--prep)}
.stat.c{border-left-color:var(--ready)}
.stat b{display:block;font-size:26px}
.stat span{color:var(--mute);font-size:14px}
.muted{color:var(--mute);font-size:14px;margin:0}

/* ---------- Order cards ---------- */
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ocard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border-top:5px solid var(--new);display:flex;flex-direction:column;gap:10px}
.ocard.preparing{border-top-color:var(--prep)}
.ocard.ready{border-top-color:var(--ready)}
.ocard.done{border-top-color:var(--done);opacity:.85}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tname{font-size:20px;font-weight:800}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:#eef2f0;color:var(--mute);white-space:nowrap}
.badge.new{background:#fff3e0;color:#a35f00}
.badge.preparing{background:#e6efff;color:#1d4fa0}
.badge.ready{background:#e3f5ea;color:#17703f}
.badge.done{background:#eceeed;color:#55605e}
.ometa{color:var(--mute);font-size:14px}
.oitems{margin:0;padding:0;list-style:none;border-top:1px dashed var(--line);padding-top:10px}
.oitems li{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.oitems li b{color:var(--brand)}
.onote{background:#fff8e6;color:#7a5200;border-radius:10px;padding:8px 10px;font-size:14px}
.ofoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.total{font-weight:800;font-size:18px}
.empty{color:var(--mute);text-align:center;padding:36px 12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);grid-column:1/-1}

/* ---------- Filters ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;align-items:end}
.filters label span{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:6px}

/* ---------- Menu ---------- */
.mitem{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mitem:first-child{border-top:0}
.mitem .n b{display:block;font-size:16px}
.mitem .n small{color:var(--mute)}
.mitem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mitem.off .n b{opacity:.5}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.tag.veg{background:#e3f5ea;color:#17703f}
.tag.nv{background:#fde8e6;color:#a32a1f}
.tag.off{background:#eceeed;color:#55605e}
.addform{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
.addform .full{grid-column:1/-1}
.addform label span{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:6px}

/* ---------- Settings ---------- */
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0}
.switch p{margin:4px 0 0;color:var(--mute);font-size:14px}

/* ---------- Summary ---------- */
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sumrow div{background:var(--bg);border-radius:12px;padding:14px;text-align:center}
.sumrow b{display:block;font-size:22px}
.sumrow span{font-size:13px;color:var(--mute)}
.topitems{font-size:15px}

/* ---------- Table-wise bill ---------- */
.tbills{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tb{background:var(--bg);border-radius:12px;padding:12px;border-left:5px solid var(--accent)}
.tb b{display:block;font-size:15px}
.tb .amt{font-size:20px;font-weight:800;color:var(--brand);margin-top:2px}
.tb small{color:var(--mute);font-size:13px}

/* ---------- Table tiles + popup ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;text-align:center;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.tile b{font-size:16px}
.tile .amt{font-size:18px;font-weight:800;color:var(--mute)}
.tile small{color:var(--mute);font-size:12px}
.tile.served{background:#eef6f2;border-color:#cfe3da}
.tile.served .amt{color:var(--ready)}
.tile.active{background:var(--accent);border-color:#d9861a;color:#1b2523;animation:pulse 1.4s ease-in-out infinite}
.tile.active .amt,.tile.active small{color:#1b2523}
.tile.pay{background:var(--brand);border-color:var(--brand);color:#fff}
.tile.pay .amt,.tile.pay small{color:#fff}
.tile.pay{animation:pulse2 1.4s ease-in-out infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(15,76,69,.6)}50%{box-shadow:0 0 0 8px rgba(15,76,69,0)}}
.warn{background:#fff3e0;color:#a35f00;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,163,58,.7)}50%{box-shadow:0 0 0 8px rgba(242,163,58,0)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto;padding:20px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h3{margin:0;font-size:22px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mstats div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.mstats b{display:block;font-size:20px}
.mstats span{font-size:12px;color:var(--mute)}
.mstats .bigbill b{color:var(--ready)}
.mlist{list-style:none;margin:0 0 12px;padding:0}
.mlist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px dashed var(--line);font-size:16px}
.mlist li .amt{font-weight:800;text-align:right}
.mlist li small{grid-column:1/-1;color:var(--mute);font-size:13px;margin-top:-2px}
.mlist li b{color:var(--brand)}
.mnote{background:#fff8e6;color:#7a5200;border-radius:10px;padding:8px 10px;font-size:14px;margin-bottom:8px}

/* ---------- Bottom nav (mobile) ---------- */
.bottom{display:none}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .app.show{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:16px 14px 110px}
  .stats{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:1fr 1fr}
  .addform{grid-template-columns:1fr 1fr}
  .topbar{padding:14px 16px}
  .topbar h2{font-size:19px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--brand);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .bottom button{background:none;border:0;color:#cfe6e1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:6px 2px;min-width:0;flex:1;position:relative}
  .bottom button .ic{font-size:20px}
  .bottom button.active{color:#fff}
