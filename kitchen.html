<!doctype html>
<html lang="hi">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pizza Hub - Kitchen</title>
  <style>
:root{--bg:#0f1716;--card:#18221f;--ink:#e8efed;--mute:#93a39e;--line:#2a3733;--new:#f2a33a;--prep:#3b82f6;--brand:#0f4c45;--ok:#1f9d55;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* Login / Join */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:360px;background:var(--card);border-radius:18px;padding:24px}
.lbox h1{margin:0 0 12px;font-size:22px}
.lbox input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px;font-size:16px}
.lbox > button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:700;font-size:16px}
.lbox .linkbtn{background:none;border:0;color:var(--mute);margin-top:12px;width:100%;font-size:14px;text-decoration:underline;padding:8px}
.lbox .tabs{display:flex;gap:8px;margin-bottom:14px}
.lbox .tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:700;font-size:15px}
.lbox .tabs button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px}
.err{color:#ff8a80;min-height:22px;font-size:14px;margin-bottom:6px}

/* Header */
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h2{margin:0;font-size:20px}
header small{color:var(--mute)}
.hbtns{display:flex;gap:8px}
.hbtns button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}
#soundBtn{background:var(--new);color:#1b2523;border:0;font-weight:700}
#soundBtn.on{background:var(--ok);color:#fff}

/* Orders */
main{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border-radius:16px;padding:16px;border-top:6px solid var(--new);display:flex;flex-direction:column;gap:10px}
.card.preparing{border-top-color:var(--prep)}
.chead{display:flex;justify-content:space-between;align-items:center}
.tname{font-size:22px;font-weight:800}
.ago{color:var(--mute);font-size:14px}
.badge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:#3a2c12;color:var(--new)}
.card.preparing .badge{background:#14284a;color:var(--prep)}
ul{list-style:none;margin:0;padding:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
li{display:flex;justify-content:space-between;padding:6px 0;font-size:18px}
li b{color:var(--new)}
.note{background:#3a2c12;color:#ffd58a;border-radius:10px;padding:8px 10px;font-size:15px}
.act{width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:18px;color:#fff;background:var(--prep)}
.card.preparing .act{background:var(--ok)}
.act:disabled{opacity:.5}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 10px;font-size:18px}
</style>
 </head>
 <body>
  <!-- LOGIN / SIGNUP -->
  <div class="login" id="login">
   <div class="lbox">
    <h1>Kitchen</h1>
    <div class="tabs">
     <button id="tLogin" class="on">Login</button>
     <button id="tSignup">Naya account</button>
    </div>
    <p class="hint" id="hint">Apna email aur password daalein</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username"> <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button id="go">Login</button>
   </div>
  </div>
  <!-- JOIN (naye staff ke liye, admin ka code) -->
  <div class="login hidden" id="join">
   <div class="lbox">
    <h1>Restaurant se judein</h1>
    <p class="hint">Admin se mila 8-character code daalein.</p>
    <input id="jName" placeholder="Aapka naam"> <input id="jCode" placeholder="Invite code (jaise 22FFA818)" autocapitalize="characters">
    <div class="err" id="jErr"></div>
    <button id="joinBtn">Join karein</button>
    <button class="linkbtn" id="jLogout">Logout</button>
   </div>
  </div>
  <!-- KITCHEN -->
  <div id="app" class="hidden">
   <header>
    <div>
     <h2>Kitchen orders</h2>
     <small id="count">Loading...</small>
    </div>
    <div class="hbtns">
     <button id="soundBtn">🔔 Sound ON karein</button>
     <button id="logout">Logout</button>
    </div>
   </header>
   <main id="list"></main>
  </div>
  <audio id="alarm" preload="auto" src="new-order.mp3"></audio>
  <script>
var SB_URL="https://pzlmykxqqtilvijntbpa.supabase.co";
var SB_KEY="sb_publishable_cr9IO17p6TI0jyEi-RDrtQ_FGH29SGh";
var KEY="kitchenSession";
var token=null,uid=null,mode="login",soundOn=false,lastMax=0,firstLoad=true;
var NEXT={"new":{to:"preparing",label:"Order banaya · Shuru karo"},"preparing":{to:"ready",label:"Done ✓"}};

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hm(d){return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function mins(iso){return Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000))}
function show(id){["login","join","app"].forEach(function(x){$(x).classList.toggle("hidden",x!==id)})}

/* ---------- Session ---------- */
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
function save(d){
  var old=load()||{};
  var s={access_token:d.access_token,refresh_token:d.refresh_token,uid:(d.user&&d.user.id)||old.uid,expires_at:Date.now()+(d.expires_in||3600)*1000-60000};
  localStorage.setItem(KEY,JSON.stringify(s));token=s.access_token;uid=s.uid;
}
function ensureToken(){
  var s=load();
  if(s&&s.expires_at>Date.now()){token=s.access_token;uid=s.uid;return Promise.resolve()}
  if(!s||!s.refresh_token)return Promise.reject("auth");
  return fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})})
    .then(function(r){return r.json()}).then(function(d){if(!d.access_token)throw "auth";save(d)});
}
function hdr(){return {"apikey":SB_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"}}
function api(path,method,body){
  method=method||"GET";
  return ensureToken().then(function(){
    var h=hdr();
    if(method!=="GET")h.Prefer="return=minimal";
    return fetch(SB_URL+"/rest/v1/"+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  }).then(function(r){
    if(r.status===401)throw "auth";
    if(!r.ok)throw new Error(r.status);
    return method==="GET"?r.json():null;
  });
}

/* ---------- Route: kaun kis screen par jaye ---------- */
function route(){
  if(!load()){show("login");return Promise.resolve()}
  return ensureToken().then(function(){
    return api("staff?select=role,restaurant_id&id=eq."+uid);
  }).then(function(rows){
    var st=rows&&rows[0];
    if(!st){show("join");return}
    if(st.role!=="kitchen"){
      localStorage.removeItem(KEY);token=null;show("login");
      $("err").textContent="Ye account kitchen ka nahi hai.";
      return;
    }
    show("app");loadOrders();
  }).catch(function(e){
    if(e==="auth"){localStorage.removeItem(KEY);show("login");$("err").textContent="Session khatam. Dobara login karein."}
    else{show("login");$("err").textContent="Network issue. Dobara try karein."}
  });
}

/* ---------- Login / Naya account ---------- */
function setMode(m){
  mode=m;
  $("tLogin").classList.toggle("on",m==="login");
  $("tSignup").classList.toggle("on",m==="signup");
  $("go").textContent=m==="login"?"Login":"Account banayein";
  $("hint").textContent=m==="login"?"Apna email aur password daalein":"Email aur password se naya account banayein, phir admin ka code daalein";
  $("err").textContent="";
}
$("tLogin").onclick=function(){setMode("login")};
$("tSignup").onclick=function(){setMode("signup")};

function authPost(path,email,pw){
  return fetch(SB_URL+"/auth/v1/"+path,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pw})}).then(function(r){return r.json()});
}
$("go").onclick=function(){
  var email=$("em").value.trim().toLowerCase(),pw=$("pw").value;
  $("err").textContent="";
  if(!email||!pw){$("err").textContent="Email aur password daalein.";return}

  if(mode==="login"){
    authPost("token?grant_type=password",email,pw)
    .then(function(d){
      if(!d.access_token)throw "login";
      save(d);
      return route();
    })
    .catch(function(e){$("err").textContent=(e==="login")?"Email ya password galat hai.":"Login fail hua. Dobara try karein."});
  }else{
    authPost("signup",email,pw)
    .then(function(d){
      if(d.access_token){save(d);return route()}
      if(d.user||d.id){
        setMode("login");
        $("err").textContent="Account ban gaya. Ab isi email aur password se login karein.";
        return;
      }
      throw new Error(d.msg||d.error_description||"signup");
    })
    .catch(function(e){$("err").textContent="Account nahi bana: "+(e.message||"dobara try karein")});
  }
};

/* ---------- Join (admin ka code) ---------- */
$("joinBtn").onclick=function(){
  var code=$("jCode").value.trim().toUpperCase(),name=$("jName").value.trim();
  $("jErr").textContent="";
  if(!code||!name){$("jErr").textContent="Naam aur code dono daalein.";return}
  ensureToken().then(function(){
    return fetch(SB_URL+"/rest/v1/rpc/redeem_staff_invite",{method:"POST",headers:hdr(),body:JSON.stringify({p_code:code,p_name:name})});
  }).then(function(r){
    if(!r.ok)throw new Error("code");
    return route();
  }).catch(function(){
    $("jErr").textContent="Code galat hai ya expire ho gaya. Admin se naya code lein.";
  });
};
function serverLogout(){
  var t=token;token=null;
  var done=function(){localStorage.removeItem(KEY);location.reload()};
  if(!t)return done();
  fetch(SB_URL+"/auth/v1/logout",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+t}}).then(done,done);
}
$("jLogout").onclick=serverLogout;
$("logout").onclick=serverLogout;

/* ---------- Sound (new-order.mp3) ---------- */
$("soundBtn").onclick=function(){
  var a=$("alarm");
  a.play().then(function(){a.pause();a.currentTime=0}).catch(function(){});
  soundOn=true;this.textContent="🔔 Sound ON hai";this.classList.add("on");
};
function beep(){
  if(!soundOn)return;
  var a=$("alarm");
  a.currentTime=0;
  a.play().catch(function(){});
  if(navigator.vibrate)navigator.vibrate([300,150,300]);
}

/* ---------- Orders ---------- */
function loadOrders(){
  var s=new Date();s.setHours(0,0,0,0);
  api("orders?select=*&status=in.(new,preparing)&created_at=gte."+encodeURIComponent(s.toISOString())+"&order=created_at.asc")
  .then(function(rows){
    var max=rows.reduce(function(a,o){return Math.max(a,o.id)},0);
    if(!firstLoad&&max>lastMax)beep();
    lastMax=Math.max(lastMax,max);firstLoad=false;
    $("count").textContent=rows.length+" order chal rahe hain";
    $("list").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">Abhi koi order nahi hai</div>';
  }).catch(function(e){
    if(e==="auth"){localStorage.removeItem(KEY);show("login");$("err").textContent="Session khatam. Dobara login karein."}
  });
}
function card(o){
  var n=NEXT[o.status]||NEXT["new"];
  var items=(o.items||[]).map(function(i){return '<li><span>'+esc(i.name)+'</span><b>'+esc(i.qty)+'×</b></li>'}).join("");
  return '<div class="card '+esc(o.status)+'">'+
    '<div class="chead"><span class="tname">Table '+esc(o.table_no)+'</span><span class="badge">'+(o.status==="new"?"Naya":"Bana rahe")+'</span></div>'+
    '<div class="ago">#'+o.id+' · '+hm(new Date(o.created_at))+' · '+mins(o.created_at)+' min pehle</div>'+
    '<ul>'+items+'</ul>'+
    (o.note?'<div class="note">Note: '+esc(o.note)+'</div>':'')+
    '<button class="act" data-id="'+o.id+'" data-to="'+n.to+'">'+n.label+'</button>'+
    '</div>';
}
$("list").onclick=function(e){
  var b=e.target.closest("button.act");if(!b)return;
  b.disabled=true;
  api("orders?id=eq."+b.dataset.id,"PATCH",{status:b.dataset.to})
  .then(loadOrders)
  .catch(function(){b.disabled=false;alert("Update nahi hua. Dobara try karein.")});
};

/* ---------- Start ---------- */
setInterval(function(){if(token&&!$("app").classList.contains("hidden"))loadOrders()},5000);
route();

/* ---- Demo branding via URL: ?name=Royal+Spice&color=7c3aed&logo=royal.png (sirf display badalta hai, data nahi) ---- */
(function(){try{
var p=new URLSearchParams(location.search),n=(p.get("name")||"").trim().slice(0,40),c=(p.get("color")||"").replace("#",""),L=(p.get("logo")||"").trim();
var u=(/^https:\/\//.test(L)||/^\/(?!\/)/.test(L))?L:(/^[\w.-]+\.(png|jpe?g|webp|svg)$/i.test(L)?"/logos/"+L:"");
function img(css){var i=document.createElement("img");i.src=u;i.alt="";i.style.cssText=css;i.onerror=function(){i.remove()};return i}
if(/^[0-9a-fA-F]{6}$/.test(c)){var r=document.documentElement.style;r.setProperty("--brand","#"+c);r.setProperty("--brand-2","#"+c)}

if(!n)return;
document.title=n+" - Kitchen";
var h=document.querySelector("#app header h2");if(h){var t=document.createElement("span");t.textContent="Kitchen orders · "+n;h.textContent="";if(u)h.appendChild(img("width:28px;height:28px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px"));h.appendChild(t)}
}catch(e){}})();
</script>
 </body>
</html>
